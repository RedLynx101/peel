[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peel-heist"
version = "0.1.0"
description = "A compact partially observable banana museum heist for transformer PPO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "gymnasium>=1.1,<2",
  "torch>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[project.scripts]
peel-train = "peel.train:main"
peel-evaluate = "peel.evaluate:main"
peel-replay = "peel.replay:main"
peel-serve = "peel.server:main"
peel-memory = "peel.memory_benchmark:main"
peel-curriculum = "peel.curriculum:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
